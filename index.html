<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>atmaram.tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Aguafina+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
  }

  .scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- background video --- */
  .bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* --- vignette --- */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 25%,
      rgba(0,0,0,0.15) 60%,
      rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
  }

  /* --- scanlines --- */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 3px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* --- film grain --- */
  .grain {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 11;
    animation: grain 0.5s steps(4) infinite;
  }
  @keyframes grain {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-5%, -5%); }
    50% { transform: translate(5%, 2%); }
    75% { transform: translate(-2%, 5%); }
  }

  /* --- text block --- */
  .text-block {
    position: relative;
    z-index: 5;
    text-align: center;
  }

  .stay {
    font-family: 'Aguafina Script', cursive;
    font-size: clamp(16px, 2.5vw, 28px);
    color: rgba(255, 230, 180, 0.5);
    letter-spacing: 0.3em;
    text-transform: lowercase;
    text-shadow: 0 0 10px rgba(255, 200, 100, 0.2);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
  }
</style>
</head>
<body>
<div class="scene">
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="atmaram_120fps.mp4" type="video/mp4">
  </video>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="grain"></div>

  <div class="text-block">
    <div class="stay">stay tuned</div>
  </div>
</div>
</body>
</html>
